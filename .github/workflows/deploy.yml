name: Deploy Backend (Laravel) to cPanel

on:
  push:
    branches:
      - the-so-called-done
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Match the PHP version selected in cPanel > MultiPHP Manager
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, json, bcmath, fileinfo, openssl, pdo_mysql, tokenizer, gd

      # Build vendor/ in CI and upload it — most cPanel shared hosts have
      # no Composer/SSH, so the server can't run `composer install`.
      # composer.json requires a patched PHP (CVE-2026-109618/109619), and the
      # generated vendor/composer/platform_check.php refuses to boot on older PHP.
      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Fail on known vulnerable dependencies
        run: composer audit --no-dev --locked

      - name: Connectivity probe (diagnose FTP timeout)
        run: |
          HOST="${{ secrets.FTP_HOST }}"
          echo "Runner public IP: $(curl -s ifconfig.me)"
          for p in 21 443 2083; do
            timeout 10 bash -c "</dev/tcp/$HOST/$p" \
              && echo "port $p OPEN" \
              || echo "port $p BLOCKED"
          done
          curl -sk -o /dev/null -w "https on 2083 -> HTTP %{http_code}\n" \
            --connect-timeout 10 "https://$HOST:2083/" || true

      # Host firewall blocks FTP (21) and HTTPS (443) from GitHub runners.
      # Port 2083 (cPanel) is reachable, so we upload a tarball through the
      # UAPI File Manager and extract it on the server instead.
      # Required secrets: CPANEL_USERNAME, CPANEL_API_TOKEN
      # (cPanel > Manage API Tokens). FTP_HOST and FTP_PATH are reused.
      - name: Deploy via cPanel UAPI (port 2083)
        env:
          CPANEL_HOST: ${{ secrets.FTP_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          DEPLOY_DIR: ${{ secrets.FTP_PATH }} # e.g. /home/cpaneluser/mgt-system/
        run: |
          set -euo pipefail
          AUTH="Authorization: cpanel $CPANEL_USER:$CPANEL_TOKEN"
          REL="${DEPLOY_DIR#/home/*/}"; REL="${REL%/}"
          echo "Deploying to $DEPLOY_DIR (relative: $REL)"

          tar -czf deploy.tar.gz \
            --exclude='./.git' --exclude='./.github' \
            --exclude='./node_modules' --exclude='./tests' \
            --exclude='./.env' --exclude='./.env.*' \
            --exclude='./storage/logs/*.log' \
            --exclude='./storage/framework/cache/data' \
            --exclude='./storage/framework/sessions' \
            --exclude='./storage/framework/views' \
            --exclude='*.log' .

          echo "== upload tarball =="
          curl -sfS -H "$AUTH" \
            "https://$CPANEL_HOST:2083/execute/Fileman/upload_files?dir=$DEPLOY_DIR&overwrite=1" \
            -F "file-0=@deploy.tar.gz;filename=deploy.tar.gz"
          echo

          echo "== extract on server =="
          curl -sfS -H "$AUTH" \
            "https://$CPANEL_HOST:2083/execute/Fileman/fileop?op=extract&sourcefiles=$REL%2Fdeploy.tar.gz&destfiles=$REL" \
          || curl -sfS -H "$AUTH" \
            "https://$CPANEL_HOST:2083/json-api/cpanel?cpanel_jsonapi_version=2&cpanel_jsonapi_user=$CPANEL_USER&cpanel_jsonapi_module=Fileman&cpanel_jsonapi_func=fileop&op=extract&sourcefiles=$REL%2Fdeploy.tar.gz&destfiles=$REL&doubledecode=0"
          echo

          echo "== remove tarball =="
          curl -sfS -H "$AUTH" \
            "https://$CPANEL_HOST:2083/execute/Fileman/fileop?op=trash&sourcefiles=$REL%2Fdeploy.tar.gz" \
          || curl -sfS -H "$AUTH" \
            "https://$CPANEL_HOST:2083/json-api/cpanel?cpanel_jsonapi_version=2&cpanel_jsonapi_user=$CPANEL_USER&cpanel_jsonapi_module=Fileman&cpanel_jsonapi_func=fileop&op=trash&sourcefiles=$REL%2Fdeploy.tar.gz&doubledecode=0" \
          || echo "cleanup failed (harmless leftover deploy.tar.gz)"

# ────────────────────────────────────────────────────────────────────────────
# MANUAL STEPS REQUIRED ON CPANEL (FTP deploys can't run artisan):
#
# 1. Point the subdomain docroot to   mgt-system/public
#    (cPanel > Domains), NOT the project root — .env must never be
#    web-accessible.
#
# 2. Create .env on the server once (cPanel > File Manager). .env.* files are
#    excluded from upload, so paste in the contents of your local
#    .env.production, then fill in APP_URL, FRONTEND_URL and the MySQL creds.
#
# 3. In cPanel > Terminal, from the app directory run ONCE:
#       php artisan migrate --force
#       php artisan storage:link
#       php artisan config:cache && php artisan route:cache
#    Re-run `php artisan migrate --force` after deploys that add migrations,
#    and `php artisan config:cache` after any .env change.
#
# 4. Make sure storage/ and bootstrap/cache are writable (chmod -R 775).
# ────────────────────────────────────────────────────────────────────────────
