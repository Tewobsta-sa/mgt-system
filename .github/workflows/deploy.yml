name: Deploy Backend (Laravel) to cPanel

on:
  push:
    branches:
      - the-so-called-done
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to diff against the last deployed commit

      # Match the PHP version selected in cPanel > MultiPHP Manager
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, json, bcmath, fileinfo, openssl, pdo_mysql, tokenizer, gd

      # Build vendor/ in CI and upload it — most cPanel shared hosts have
      # no Composer/SSH, so the server can't run `composer install`.
      # composer.json requires a patched PHP (CVE-2026-109618/109619), and the
      # generated vendor/composer/platform_check.php refuses to boot on older PHP.
      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Fail on known vulnerable dependencies
        run: composer audit --no-dev --locked

      # Host firewall blocks FTP (21) and HTTPS (443) from GitHub runners.
      # Port 2083 (cPanel) is reachable, so deploys go through the UAPI
      # File Manager. This host's cPanel has no Cron module and
      # Fileman::fileop extract does not overwrite, so instead of a tarball
      # we upload each changed file directly (upload_files supports
      # overwrite). A .deploy-rev file on the server records the last
      # deployed commit; only files changed since then are uploaded.
      # Note: files deleted from the repo are left on the server —
      # harmless for Laravel (autoload is classmap-based).
      # Required secrets: CPANEL_USERNAME, CPANEL_API_TOKEN
      # (cPanel > Manage API Tokens). FTP_HOST and FTP_PATH are reused.
      - name: Deploy via cPanel UAPI (port 2083)
        env:
          CPANEL_HOST: ${{ secrets.FTP_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          DEPLOY_DIR: ${{ secrets.FTP_PATH }} # e.g. /home/cpaneluser/mgt-system/
        run: |
          set -euo pipefail
          AUTH="Authorization: cpanel $CPANEL_USER:$CPANEL_TOKEN"
          HOST="$(echo "$CPANEL_HOST" | tr -d '[:space:]')"
          HOST="${HOST#*://}"; HOST="${HOST%%/*}"; HOST="${HOST%%:*}"
          REL="${DEPLOY_DIR#/home/*/}"
          REL="${REL#/}"; REL="${REL%/}"
          echo "Deploying to $DEPLOY_DIR (relative: $REL) on $HOST"

          check() { echo "$1"; echo "$1" | grep -q '"status":1' || { echo "API call FAILED"; exit 1; }; }

          echo "== read last deployed revision =="
          resp=$(curl -sfS -H "$AUTH" \
            "https://$HOST:2083/execute/Fileman/get_file_content?dir=$REL&file=.deploy-rev" || true)
          echo "$resp"
          OLD=$(echo "$resp" | jq -r '.data.content // empty' | tr -d '[:space:]')

          if [ -n "$OLD" ] && git cat-file -e "$OLD^{commit}" 2>/dev/null; then
            echo "last deployed commit: $OLD — uploading files changed since then"
            git diff --name-only --diff-filter=d "$OLD" HEAD > /tmp/upload.txt
          else
            echo "no prior revision found — full upload"
            git ls-files > /tmp/upload.txt
          fi

          # Same exclusions the tarball had (mostly redundant since only
          # tracked files are listed, but keeps tests/ and .github/ out).
          grep -vE '^\.github/|^tests/|^\.env|\.env\.|\.log$' /tmp/upload.txt \
            > /tmp/files.txt || true
          echo "$(wc -l < /tmp/files.txt) files to upload"

          # upload_files puts all files into a single `dir`, so batch each
          # request by target directory (sorting on the "dir<TAB>path" key
          # keeps files from the same directory contiguous).
          echo "== upload files (batched by directory) =="
          outdir=""; i=0; args=()
          flush() {
            [ "$i" -eq 0 ] && return 0
            if [ "$outdir" = "." ]; then dir="$REL"; else dir="$REL/$outdir"; fi
            resp=$(curl -sfS -H "$AUTH" \
              "https://$HOST:2083/execute/Fileman/upload_files?dir=$dir&overwrite=1" \
              "${args[@]}")
            check "$resp"
            i=0; args=()
          }
          while IFS=$'\t' read -r d f; do
            [ "$d" != "$outdir" ] && { flush; outdir="$d"; }
            args+=(-F "file-$i=@$f"); i=$((i+1))
          done < <(
            awk -F/ '{ if (NF>1) { d=$0; sub("/[^/]+$","",d) } else d="."
                       print d "\t" $0 }' /tmp/files.txt | sort
          )
          flush
          echo "upload complete"

          echo "== write .deploy-rev =="
          resp=$(curl -sfS -G -H "$AUTH" \
            "https://$HOST:2083/execute/Fileman/save_file_content" \
            --data-urlencode "dir=$REL" --data-urlencode "file=.deploy-rev" \
            --data-urlencode "content=$(git rev-parse HEAD)")
          check "$resp"
          echo "deployed $(git rev-parse HEAD)"

# ────────────────────────────────────────────────────────────────────────────
# MANUAL STEPS REQUIRED ON CPANEL (FTP deploys can't run artisan):
#
# 1. Point the subdomain docroot to   mgt-system/public
#    (cPanel > Domains), NOT the project root — .env must never be
#    web-accessible.
#
# 2. Create .env on the server once (cPanel > File Manager). .env.* files are
#    excluded from upload, so paste in the contents of your local
#    .env.production, then fill in APP_URL, FRONTEND_URL and the MySQL creds.
#
# 3. In cPanel > Terminal, from the app directory run ONCE:
#       php artisan migrate --force
#       php artisan storage:link
#       php artisan config:cache && php artisan route:cache
#    Re-run `php artisan migrate --force` after deploys that add migrations,
#    and `php artisan config:cache` after any .env change.
#
# 4. Make sure storage/ and bootstrap/cache are writable (chmod -R 775).
# ────────────────────────────────────────────────────────────────────────────
