name: Connectivity probe

on: workflow_dispatch

jobs:
  probe:
    name: Test server reachability from GitHub runner
    runs-on: ubuntu-latest
    steps:
      - name: Test TCP ports
        run: |
          HOST="${{ secrets.FTP_HOST }}"
          echo "Testing $HOST from this GitHub runner ($(curl -s ifconfig.me))"
          for p in 21 443 2083; do
            timeout 10 bash -c "</dev/tcp/$HOST/$p" \
              && echo "port $p OPEN" \
              || echo "port $p BLOCKED"
          done

      - name: Test cPanel HTTPS endpoint
        run: |
          curl -sk -o /dev/null -w "https on 2083 -> HTTP %{http_code}\n" \
            --connect-timeout 10 "https://${{ secrets.FTP_HOST }}:2083/" \
            || echo "2083 https unreachable"
